<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <style>
    .f{font-family:'Play','Trebuchet MS','Segoe UI',system-ui,sans-serif}
    .m{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    .sh{filter:drop-shadow(2px 2px 4px rgba(0,0,0,.8))}
  </style>
  <rect width="1920" height="1080" rx="24" fill="#0d1117"/>
  <text class="f sh" x="960" y="80" font-size="40" letter-spacing="6" fill="#e6edf3" text-anchor="middle" dominant-baseline="central">ONE PROMPT, FOUR SYSTEM PROMPTS</text>
  <rect x="60" y="138" width="1800" height="62" rx="14" fill="rgba(8,12,18,0.78)" stroke="rgba(230,237,243,0.20)" stroke-width="3"/>
  <text class="m" x="88" y="169" font-size="24" fill="#58a6ff" dominant-baseline="central">&gt;</text>
  <text class="m" x="118" y="169" font-size="24" fill="#e6edf3" dominant-baseline="central">why did the build fail?</text>

  <!-- STOCK -->
  <rect x="60" y="230" width="432" height="730" rx="16" fill="rgba(8,12,18,0.78)" stroke="#f85149" stroke-width="3"/>
  <text class="f sh" x="86" y="278" font-size="27" letter-spacing="2" fill="#8b949e" dominant-baseline="central">STOCK</text>
  <text class="m" x="86" y="310" font-size="15" fill="rgba(230,237,243,0.45)" dominant-baseline="central">just stock-opus</text>
  <line x1="86" y1="334" x2="466" y2="334" stroke="rgba(230,237,243,0.15)" stroke-width="2"/>
  <text class="m" x="86" y="366" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">Great question! Let me analyze the</text>
  <text class="m" x="86" y="391" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">build failure for you.</text>
  <text class="m" x="86" y="441" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">## Root Cause Analysis</text>
  <text class="m" x="86" y="491" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">The build failed due to a **missing</text>
  <text class="m" x="86" y="516" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">import** — and this is the key part —</text>
  <text class="m" x="86" y="541" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">the resolver cannot locate `verify`.</text>
  <text class="m" x="86" y="591" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">### What happened</text>
  <text class="m" x="86" y="641" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">1. `src/auth.ts:12` calls `verify()`</text>
  <text class="m" x="86" y="666" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">2. No import statement provides it</text>
  <text class="m" x="86" y="691" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">3. Type resolution fails</text>
  <text class="m" x="86" y="741" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">### The Fix</text>
  <text class="m" x="86" y="791" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">Add the import — the load-bearing</text>
  <text class="m" x="86" y="816" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">line here:</text>
  <text class="m" x="86" y="866" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">`import { verify } from "./jwt"`</text>
  <text class="m" x="86" y="916" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">Let me know if you'd like me to</text>
  <text class="m" x="86" y="941" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">apply this change!</text>

  <!-- CAVEMAN -->
  <rect x="516" y="230" width="432" height="730" rx="16" fill="rgba(8,12,18,0.78)" stroke="#d29922" stroke-width="3"/>
  <text class="f sh" x="542" y="278" font-size="27" letter-spacing="2" fill="#d29922" dominant-baseline="central">CAVEMAN</text>
  <text class="m" x="542" y="310" font-size="15" fill="rgba(230,237,243,0.45)" dominant-baseline="central">just tuned-opus caveman_style</text>
  <line x1="542" y1="334" x2="922" y2="334" stroke="rgba(230,237,243,0.15)" stroke-width="2"/>
  <text class="m" x="542" y="366" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">Missing import. src/auth.ts line 12.</text>
  <text class="m" x="542" y="416" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">Add `import { verify } from "./jwt"`.</text>
  <text class="m" x="542" y="466" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">Build work then.</text>

  <!-- ELI5 -->
  <rect x="972" y="230" width="432" height="730" rx="16" fill="rgba(8,12,18,0.78)" stroke="#a371f7" stroke-width="3"/>
  <text class="f sh" x="998" y="278" font-size="27" letter-spacing="2" fill="#a371f7" dominant-baseline="central">ELI5</text>
  <text class="m" x="998" y="310" font-size="15" fill="rgba(230,237,243,0.45)" dominant-baseline="central">just tuned-opus eli5_style</text>
  <line x1="998" y1="334" x2="1378" y2="334" stroke="rgba(230,237,243,0.15)" stroke-width="2"/>
  <text class="m" x="998" y="366" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">The code asked for something that</text>
  <text class="m" x="998" y="391" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">was not there.</text>
  <text class="m" x="998" y="441" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">In the file `src/auth.ts` on line 12,</text>
  <text class="m" x="998" y="466" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">it uses a helper called `verify`, but</text>
  <text class="m" x="998" y="491" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">nobody told the file where to find it.</text>
  <text class="m" x="998" y="541" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">Add this line at the top of the file</text>
  <text class="m" x="998" y="566" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">and it will work:</text>
  <text class="m" x="998" y="616" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">`import { verify } from "./jwt"`</text>

  <!-- COMMUNICATION -->
  <rect x="1428" y="230" width="432" height="730" rx="16" fill="rgba(8,12,18,0.78)" stroke="#3fb950" stroke-width="3"/>
  <text class="f sh" x="1454" y="278" font-size="27" letter-spacing="2" fill="#3fb950" dominant-baseline="central">COMMUNICATION</text>
  <text class="m" x="1454" y="310" font-size="15" fill="rgba(230,237,243,0.45)" dominant-baseline="central">just tuned-opus</text>
  <line x1="1454" y1="334" x2="1834" y2="334" stroke="rgba(230,237,243,0.15)" stroke-width="2"/>
  <text class="m" x="1454" y="366" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">Missing import at src/auth.ts:12.</text>
  <text class="m" x="1454" y="416" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">Add `import { verify } from "./jwt"`</text>
  <text class="m" x="1454" y="441" font-size="17" fill="rgba(230,237,243,0.82)" dominant-baseline="central">at the top of the file.</text>

  <text class="f" x="960" y="1015" font-size="30" letter-spacing="3" fill="rgba(230,237,243,0.5)" text-anchor="middle" dominant-baseline="central">SAME MODEL. SAME PROMPT. ONE APPENDED FILE.</text>
</svg>
