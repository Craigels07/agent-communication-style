<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <style>
    .f{font-family:'Play','Trebuchet MS','Segoe UI',system-ui,sans-serif}
    .m{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace}
    .sh{filter:drop-shadow(2px 2px 4px rgba(0,0,0,.8))}
    .card{fill:rgba(8,12,18,0.78);stroke-width:3}
    .lbl{font-size:36px;letter-spacing:2px;fill:#e6edf3}
    .sub{font-size:24px;fill:rgba(230,237,243,0.55)}
    .wire{fill:none;stroke:rgba(230,237,243,0.28);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 1 1 L 11 6 L 1 11" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" rx="24" fill="#0d1117"/>

  <!-- title -->
  <text class="f sh" x="960" y="110" font-size="44" letter-spacing="6" fill="#e6edf3" text-anchor="middle" dominant-baseline="central">WHAT THE MODEL ACTUALLY SEES</text>

  <!-- input cards -->
  <g>
    <rect class="card" x="110" y="220" width="420" height="130" rx="16" stroke="#58a6ff"/>
    <circle cx="160" cy="285" r="12" fill="#58a6ff"/>
    <text class="f lbl" x="200" y="270" dominant-baseline="central">SYSTEM PROMPT</text>
    <text class="f sub" x="200" y="312" dominant-baseline="central">how it should work</text>
  </g>
  <g>
    <rect class="card" x="110" y="390" width="420" height="130" rx="16" stroke="#3fb950"/>
    <circle cx="160" cy="455" r="12" fill="#3fb950"/>
    <text class="f lbl" x="200" y="440" dominant-baseline="central">USER PROMPT</text>
    <text class="f sub" x="200" y="482" dominant-baseline="central">what you asked for</text>
  </g>
  <g>
    <rect class="card" x="110" y="560" width="420" height="130" rx="16" stroke="#d29922"/>
    <circle cx="160" cy="625" r="12" fill="#d29922"/>
    <text class="f lbl" x="200" y="610" dominant-baseline="central">TOOLS</text>
    <text class="f sub" x="200" y="652" dominant-baseline="central">what it can do</text>
  </g>
  <g>
    <rect class="card" x="110" y="730" width="420" height="130" rx="16" stroke="#a371f7"/>
    <circle cx="160" cy="795" r="12" fill="#a371f7"/>
    <text class="f lbl" x="200" y="780" dominant-baseline="central">HISTORY</text>
    <text class="f sub" x="200" y="822" dominant-baseline="central">what came before</text>
  </g>

  <!-- wires converging into the context window -->
  <path class="wire" d="M 530 285 H 640 V 540"/>
  <path class="wire" d="M 530 455 H 640 V 540"/>
  <path class="wire" d="M 530 625 H 640 V 540"/>
  <path class="wire" d="M 530 795 H 640 V 540"/>
  <path class="wire" d="M 640 540 H 680" marker-end="url(#arw)" stroke="#58a6ff"/>

  <!-- context window -->
  <rect x="700" y="400" width="400" height="280" rx="18" fill="rgba(8,12,18,0.78)" stroke="#58a6ff" stroke-width="4"/>
  <text class="f sh" x="900" y="470" font-size="36" letter-spacing="3" fill="#58a6ff" text-anchor="middle" dominant-baseline="central">CONTEXT WINDOW</text>
  <rect x="760" y="520" width="280" height="12" rx="6" fill="rgba(88,166,255,0.55)"/>
  <rect x="760" y="552" width="230" height="12" rx="6" fill="rgba(63,185,80,0.55)"/>
  <rect x="760" y="584" width="260" height="12" rx="6" fill="rgba(210,153,34,0.55)"/>
  <rect x="760" y="616" width="190" height="12" rx="6" fill="rgba(163,113,247,0.55)"/>

  <!-- context -> model -->
  <path class="wire" d="M 1100 540 H 1180" stroke="#58a6ff" marker-end="url(#arw)"/>

  <!-- model -->
  <rect x="1190" y="440" width="260" height="200" rx="18" fill="rgba(8,12,18,0.78)" stroke="rgba(230,237,243,0.20)" stroke-width="3"/>
  <text class="f sh" x="1320" y="540" font-size="40" letter-spacing="4" fill="#e6edf3" text-anchor="middle" dominant-baseline="central">MODEL</text>

  <!-- model -> response -->
  <path class="wire" d="M 1450 540 H 1530" stroke="#58a6ff" marker-end="url(#arw)"/>

  <!-- response -->
  <rect x="1540" y="440" width="270" height="200" rx="18" fill="rgba(8,12,18,0.78)" stroke="rgba(230,237,243,0.20)" stroke-width="3"/>
  <text class="f sh" x="1675" y="540" font-size="38" letter-spacing="3" fill="#e6edf3" text-anchor="middle" dominant-baseline="central">RESPONSE</text>

  <!-- caption -->
  <text class="f" x="960" y="970" font-size="30" letter-spacing="3" fill="rgba(230,237,243,0.5)" text-anchor="middle" dominant-baseline="central">FOUR INPUTS, ONE FLAT BLOCK OF TOKENS</text>
</svg>
